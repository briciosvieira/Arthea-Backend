name: consultorio_backend

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      # PostgreSQL 18
      - pgdata:/var/lib/postgresql

      # Backup existente no servidor, somente para leitura
      - /home/backup:/backup:ro

    ports:
      # Banco disponível somente dentro do próprio servidor.
      # Não fica exposto diretamente na internet.
      - "127.0.0.1:${DB_PORT}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    ports:
      # Depois o Nginx apontará para essa porta
      - "127.0.0.1:${PORT:-3000}:3000"

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production

    volumes:
      - ./files:/app/files
      - ./uploads:/app/uploads

volumes:
  pgdata: